name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'installer.iss'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name VideoStudioPersonal app.py
          if (!(Test-Path 'dist/VideoStudioPersonal/VideoStudioPersonal.exe')) { throw 'EXE build failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if (!(Test-Path 'installer/VideoStudioPersonal_Setup.exe')) { throw 'Installer build failed' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudioPersonal-Windows-Installer
          path: installer/VideoStudioPersonal_Setup.exe
          if-no-files-found: error
          retention-days: 30
