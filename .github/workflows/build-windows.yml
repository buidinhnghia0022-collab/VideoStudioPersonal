name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0
          choco install innosetup --no-progress -y

      - name: Download FFmpeg essentials
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile 'ffmpeg.zip'
          Expand-Archive -Path 'ffmpeg.zip' -DestinationPath 'ffmpeg-build' -Force
          $ffmpeg = Get-ChildItem -Path 'ffmpeg-build' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path 'ffmpeg-build' -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'FFmpeg binaries not found after extraction' }
          New-Item -ItemType Directory -Force -Path 'tools\ffmpeg' | Out-Null
          Copy-Item $ffmpeg.FullName 'tools\ffmpeg\ffmpeg.exe'
          Copy-Item $ffprobe.FullName 'tools\ffmpeg\ffprobe.exe'
          & 'tools\ffmpeg\ffmpeg.exe' -version

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name VideoStudioPersonal --collect-all yt_dlp --collect-all faster_whisper --collect-all ctranslate2 --add-binary 'tools\ffmpeg\ffmpeg.exe;tools\ffmpeg' --add-binary 'tools\ffmpeg\ffprobe.exe;tools\ffmpeg' app.py
          if (!(Test-Path 'dist/VideoStudioPersonal/VideoStudioPersonal.exe')) { throw 'EXE build failed' }

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if (!(Test-Path 'installer/VideoStudioPersonal_Setup.exe')) { throw 'Installer build failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: VideoStudioPersonal-Windows-Installer
          path: installer/VideoStudioPersonal_Setup.exe
          if-no-files-found: error
          retention-days: 30
